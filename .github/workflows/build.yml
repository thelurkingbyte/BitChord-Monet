name: Build Monet APK

on:
  push:
    branches: [main, monet-features]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships an Android SDK. Do NOT use
      # android-actions/setup-android@v3 here: it tries to install the removed
      # legacy "tools" package and fails with "Failed to find package 'tools'".
      - name: Install SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"; fi
          echo "ANDROID_HOME=$ANDROID_HOME sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      # AGP 8.10.1 resolves compileSdk 37 to the hash "android-37", but the
      # current SDK ships that platform as the minor-versioned "android-37.0".
      # Alias it so the build finds it (SDK-side only; no repo change).
      - name: Alias android-37 platform
        run: |
          cp -a "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          sed -i 's/AndroidVersion.ApiLevel=37.0/AndroidVersion.ApiLevel=37/' "$ANDROID_HOME/platforms/android-37/source.properties"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build monet debug
        run: ./gradlew :app:assembleMonetDebug -Pbitchord.bundleWear=false --stacktrace

      # Seamless updates need a *stable* signing key: debug APKs are signed
      # with an ephemeral per-run debug key, so one cannot update another. When
      # the MONET_KEYSTORE_BASE64 secret is set, also build a release APK signed
      # with it; successive release APKs then update each other and keep data.
      - name: Build signed release
        env:
          KEYSTORE_BASE64: ${{ secrets.MONET_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MONET_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MONET_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MONET_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "MONET_KEYSTORE_BASE64 not set; skipping release build."
            exit 0
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/monet.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/monet.jks"
          ./gradlew :app:assembleMonetRelease -Pbitchord.bundleWear=false --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-Monet-debug
          path: app/build/outputs/apk/monet/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-Monet-release
          path: app/build/outputs/apk/monet/release/*.apk
          if-no-files-found: ignore

      # Publish a GitHub Release (so Obtainium can track it) only when the commit
      # message contains [release]. Tags are monet-v<versionCode>.
      - name: Publish release
        if: contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_SHA::7}"
          TAG="monet-v${VERSION}"
          APK=$(ls app/build/outputs/apk/monet/release/*universal*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(ls app/build/outputs/apk/monet/release/*.apk 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "No release APK found; skipping."
            exit 0
          fi
          gh release create "$TAG" \
            --title "BitChord-Monet $TAG" \
            --notes "Signed BitChord-Monet build. Install over the previous release; data is preserved." \
            "$APK"